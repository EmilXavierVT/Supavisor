services:
  db:
    image: postgres:16-alpine
    container_name: supavisor-postgres
    environment:
      POSTGRES_DB: supavisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - supavisor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supavisor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supavisor-postgres-data:
