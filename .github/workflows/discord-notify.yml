name: Notify Discord on Main Push

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set"
            exit 1
          fi

          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg message "$COMMIT_MESSAGE" \
            --arg author "$COMMIT_AUTHOR" \
            --arg url "$COMMIT_URL" \
            '{
              content: "A push to `main` was executed.",
              embeds: [{
                title: "New push to main",
                url: $url,
                color: 5814783,
                fields: [
                  { name: "Repository", value: $repository, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: $sha, inline: true },
                  { name: "Author", value: $author, inline: true },
                  { name: "Message", value: $message, inline: false }
                ]
              }]
            }')

          curl \
            --fail \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
